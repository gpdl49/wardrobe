name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer PR run replaces an older one; on main a newer run waits, so a
# publish already pushing is never cancelled halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wardrobe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      # The database name must contain "test": the suite wipes it.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wardrobe_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/aube-action@c0d7e61d732be4362538a371e6d9a910d2cb5be8 # v1.1.2
        with:
          version: "2.9.0"
          node-version: auto
          run-install: true
          cache: true

      - name: Lint
        run: aube run --no-install lint

      - name: Typecheck
        run: aube run --no-install typecheck

      - name: Test
        run: |
          node scripts/fetch-photo-model.mjs
          aube run --no-install test

      - name: Build
        run: aube run --no-install build

  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # GitHub-hosted: the repo is public, so its minutes are free, and the
    # self-hosted runners must never serve a public repo (a fork PR could
    # retarget them). buildah needs the privileged container.
    container:
      image: quay.io/buildah/stable:v1.43.5@sha256:a6f96bfffc47f36462985573d85e87f782bf2d8b37e02cb3dd307713bfa6cc13
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GHCR
        run: |
          printf '%s' '${{ secrets.GITHUB_TOKEN }}' | buildah login ghcr.io \
            --username '${{ github.actor }}' \
            --password-stdin

      - name: Build image
        run: |
          buildah --storage-driver=vfs bud \
            --isolation=chroot \
            --file Dockerfile \
            --tag ghcr.io/gpdl49/wardrobe:main \
            --tag ghcr.io/gpdl49/wardrobe:main-${{ github.sha }} \
            .

      - name: Push image
        run: |
          for tag in ghcr.io/gpdl49/wardrobe:main ghcr.io/gpdl49/wardrobe:main-${{ github.sha }}; do
            buildah --storage-driver=vfs push --tls-verify=true "$tag" "docker://$tag"
          done
