# Local services for `aubr dev` and `aube test` (see README.md).
#   docker compose up -d
services:
  postgres:
    image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    environment:
      POSTGRES_USER: wardrobe
      POSTGRES_PASSWORD: wardrobe
      POSTGRES_DB: wardrobe
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: wardrobe
      MINIO_ROOT_PASSWORD: wardrobe-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

  # Creates the bucket with the CORS rule the browser uploads need.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 wardrobe wardrobe-secret; do sleep 1; done;
      mc mb --ignore-existing local/centerpoint-wardrobe-photos
      "

volumes:
  postgres:
  minio:
